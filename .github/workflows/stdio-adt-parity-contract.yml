name: Checked stdio/on-is cross-compiler contract (metadata only)

on:
  pull_request:
    paths:
      - "contracts/v1/stdio-adt-parity-v1.json"
      - "contracts/v1/atto-backend-inventory-v1.json"
      - "tests/atto-backend-inventory.test.mjs"
      - "tests/stdio_adt_parity.rs"
      - "tests/stdio-conformance-runner.test.mjs"
      - "tools/run-stdio-conformance.mjs"
      - "docs/stdio-adt-is-parity.md"
      - ".github/workflows/stdio-adt-parity-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact PR source before source-free tests
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "ATTO_PARITY_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "ATTO_PARITY_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up Node.js 22 for portable runner validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Reject forged eleven-backend source/CI parity evidence
        run: node --test tests/atto-backend-inventory.test.mjs
      - name: Fail-closed stdio runner validation (no guest claims)
        run: node --test tests/stdio-conformance-runner.test.mjs
      - name: Rust metadata and anti-forgery contract checks (no guest claims)
        run: cargo test --locked --test stdio_adt_parity
