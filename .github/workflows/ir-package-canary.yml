name: Independent IR package canary (host only)
on:
  pull_request:
    paths:
      - 'scripts/ir-package-canary.sh'
      - '.github/workflows/ir-package-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Execute six real native linker configurations
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree}
          test "$(git hash-object scripts/ir-package-canary.sh)" = 2e4fc7ac7e261bc9a7a3b52a531b02dcb6f3e867
          clang --version
          ld.lld --version
          llvm-ar --version
          for opt in 0 2; do
            for lto in off full thin; do
              OPT="$opt" LTO="$lto" bash scripts/ir-package-canary.sh
            done
          done
