name: Exact-source generator guest and async-sequence verification

on:
  push:
    branches:
      - ci/generator-language-sequences-6e59eda7-20261112

permissions:
  contents: read

jobs:
  generator-guest-and-streams:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            selectors: 'GeneratorCancellationInterruptionTest,GeneratorRuntimeTest'
          - suite: language
            selectors: 'GeneratorCanonicalAdmissionTest,GeneratorLanguageTest'
          - suite: streams
            selectors: 'GeneratorAdmissionStickyAsyncTest,GeneratorTerminalFailureStickyTest,AsyncSequencesTest,AsyncSequenceCollectorsTest,AsyncRuntimeTest'
    steps:
      - name: Checkout local funded mirror
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce exact original Java compiler/stdlib/test Git objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:compiler/src/main)" = f48ad33ea8885158b3a0e8735ee8f7a051f6c47f
          test "$(git rev-parse HEAD:compiler/stdlib)" = 711c0751213039f6d047099aad9fa9e754eb8ce6
          test "$(git hash-object compiler/pom.xml)" = 8cf5eb37b685834ba79860d2fb693efc319c51e3
          test "$(git hash-object compiler/src/test/java/dev/oreslang/GeneratorCanonicalAdmissionTest.java)" = c9ff9c8bce78928f03db7a8312ff20b8d11882d1
          test "$(git hash-object compiler/src/test/java/dev/oreslang/GeneratorLanguageTest.java)" = 9ca84315f7baeb9cbea8d0fd20651bef5b8e332c
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/GeneratorAdmissionStickyAsyncTest.java)" = 3a2f7156f0fc7486b8c43974bf72a136b139ab2b
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/GeneratorTerminalFailureStickyTest.java)" = 451fa0615ec8d6cef7c5330ec641bb39eabd55f1
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/AsyncSequencesTest.java)" = 2c177fc6e1e15090c9f8e833c1b23004984839e7
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/AsyncSequenceCollectorsTest.java)" = ad71e0038dd4032ef9c07175778a49f772a87293
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/AsyncRuntimeTest.java)" = f5e44085a3e97b973ec3172db8b6b459b7ebf666
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/GeneratorCancellationInterruptionTest.java)" = ff7818fe865261a95df8ee4958c78567892d9a33
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/GeneratorRuntimeTest.java)" = e32cf51254eac98512df33ffc08c377c3d099a0b
          test "$(git hash-object compiler/src/main/java/dev/oreslang/types/OwnershipChecker.java)" = adcf9bb23bd9953c0a4477423d781af55ed8f53d
          printf 'EXACT_SOURCE_HEAD=6e59eda7f14a923a00508a9e8080ff1b1c5d0629 MIRROR_HEAD=%s JAVA_TREE=f48ad33ea8885158b3a0e8735ee8f7a051f6c47f\n' "$GITHUB_SHA"
      - name: Set up GraalVM Java 25
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
          cache-dependency-path: compiler/pom.xml
      - name: Execute compiler guest/async-stream JUnit
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          SELECTORS: ${{ matrix.selectors }}
        run: |
          set -euo pipefail
          echo "START_GENERATOR_EXTENDED_SUITE=$SUITE"
          timeout --signal=TERM --kill-after=20s 600s \
            mvn -B -ntp -f compiler/pom.xml \
              "-Dtest=$SELECTORS" -DfailIfNoTests=true -DtrimStackTrace=false test \
            2>&1 | tee "generator-extended-$SUITE.log"
          if [ "$SUITE" = core ]; then
            java compiler/scripts/VerifyGeneratorCloseReports.java \
              compiler/target/surefire-reports/TEST-dev.oreslang.runtime.GeneratorCancellationInterruptionTest.xml \
              compiler/target/surefire-reports/TEST-dev.oreslang.runtime.GeneratorRuntimeTest.xml
          fi
          echo "PASS_GENERATOR_EXTENDED_SUITE=$SUITE"
      - name: Preserve actual executed JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-extended-${{ matrix.suite }}
          path: |
            compiler/target/surefire-reports/
            generator-extended-*.log
          if-no-files-found: ignore
