name: Package linkage host canary (not Atto guest parity)
on:
  pull_request:
    paths:
      - 'scripts/native-package-link-canary.sh'
      - '.github/workflows/package-linkage-host-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host-linker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        opt: [0, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify revision and execute host canary
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPT: ${{ matrix.opt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree}
          clang --version
          readelf --version
          bash scripts/native-package-link-canary.sh
          echo 'RECEIPT scope=HOST_LINKER_ONLY atto_guest=NOT_EXECUTED'
