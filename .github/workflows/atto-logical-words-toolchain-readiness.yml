name: AttoLang source-free alternate-org toolchain readiness (NOT GUEST)
on:
  push:
    branches:
      - ci/atto-logical-words-runner-probe-20261110
permissions:
  contents: read
  pull-requests: read
jobs:
  toolchain-readiness:
    name: source-free-gcc-clang-node-cmake-NOT-GUEST
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Record runner and exact probe revision
        shell: bash
        env:
          EXPECTED_REF: refs/heads/ci/atto-logical-words-runner-probe-20261110
          PROBE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          [[ "$PROBE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$RUNNER_NAME"
          echo "ATTO_CARRIER_SOURCE_FREE_SHA=$PROBE_SHA"
          echo "ATTO_CARRIER_RUN=$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          echo "ATTO_PRIVATE_SOURCE_CHECKOUT=NONE"
          echo "ATTO_COMPILER_GUEST_EXECUTION=NOT_EXECUTED"
      - name: Build standalone C++20 smoke with GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atto-toolchain"
          cd "$RUNNER_TEMP/atto-toolchain"
          cat > smoke.cpp <<'CPP'
          #include <iostream>
          int main() {
              std::cout << "ATTO_SOURCE_FREE_CPP20_TOOLCHAIN_PASS" << '\n';
              return 0;
          }
          CPP
          for compiler in g++ clang++; do
            "$compiler" --version | head -n1
            "$compiler" -std=c++20 -Wall -Wextra -Werror -O2 smoke.cpp -o "smoke-${compiler//+/p}"
            result="$("./smoke-${compiler//+/p}")"
            test "$result" = ATTO_SOURCE_FREE_CPP20_TOOLCHAIN_PASS
            echo "ATTO_CARRIER_COMPILE_EXECUTE_PASS=$compiler"
          done
      - name: Execute native Node test-runner smoke
        shell: bash
        run: |
          set -euo pipefail
          node --version
          cat > "$RUNNER_TEMP/atto-source-free.test.mjs" <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          test('source-free carrier can execute Node tests', () => {
              assert.equal((false && true) || (true !== true) || true, true);
          });
          JS
          node --test "$RUNNER_TEMP/atto-source-free.test.mjs"
          echo "ATTO_CARRIER_NODE_RUNNER_PASS=1_NOT_GUEST"
      - name: Exercise GitHub metadata-only reviewer-permission endpoint (own repo)
        shell: bash
        env:
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from urllib.parse import quote
          repo = "atto-lang/atto-compilers-parity-testing"
          if (os.environ["GITHUB_REPOSITORY"] != repo or
                  os.environ["GITHUB_REF"] !=
                  "refs/heads/ci/atto-logical-words-runner-probe-20261110"):
              raise SystemExit("DENIED: unexpected source-free carrier")
          def fetch(path):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + ("/" + path if path else ""),
                  headers={
                      "Authorization": "Bearer " + os.environ["READ_ONLY_GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "atto-owned-metadata-permission-smoke",
                  })
              with urllib.request.urlopen(req, timeout=20) as res:
                  return json.load(res)
          metadata = fetch("")
          if metadata.get("id") != 1448719198 or metadata.get("private") is not True:
              raise SystemExit("DENIED: carrier repository identity mismatch")
          pull = fetch("pulls/11")
          reviewer = (pull.get("user") or {})
          name, uid = reviewer.get("login"), reviewer.get("id")
          if not isinstance(name, str) or not isinstance(uid, int):
              raise SystemExit("DENIED: invalid live PR author")
          permission = fetch("collaborators/" + quote(name, safe="") + "/permission")
          if ((permission.get("user") or {}).get("id") != uid or
                  permission.get("permission") not in
                  ("admin", "write", "maintain", "read", "triage")):
              raise SystemExit("DENIED: permission response unusable")
          reviews = fetch("pulls/11/reviews?per_page=100&page=1")
          if not isinstance(reviews, list):
              raise SystemExit("DENIED: malformed review API response")
          print("ATTO_CARRIER_OWN_REPO_METADATA_API_ACCESS=PASS")
          print("ATTO_CARRIER_COLLABORATOR_PERMISSION_ENDPOINT=PASS")
          print("ATTO_CARRIER_REVIEW_API_ENDPOINT=PASS")
          print("ATTO_FOREIGN_PRIVATE_REPOSITORY_ACCESS=NOT_ATTEMPTED")
          print("ATTO_SOURCE_ORG_PERMISSION_ENDPOINT=NOT_TESTED")
          print("ATTO_COMPILER_GUEST=NOT_EXECUTED")
          PY

      - name: Execute source-free CMake and CTest smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atto-cmake"
          cd "$RUNNER_TEMP/atto-cmake"
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(AttoSourceFreeCarrier LANGUAGES CXX)
          enable_testing()
          add_executable(smoke smoke.cpp)
          add_test(NAME source_free_compiler_driver COMMAND smoke)
          CMAKE
          cat > smoke.cpp <<'CPP'
          int main() { return 0; }
          CPP
          cmake -S . -B build -DCMAKE_CXX_STANDARD=20
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          echo "ATTO_CARRIER_CMAKE_CTEST_PASS=1_NOT_GUEST"
