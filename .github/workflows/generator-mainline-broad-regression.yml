name: Generator extended current-main exact-source regressions
on:
  push:
    branches:
      - ci/generator-mainline-broad-ddee99ce-20261112
permissions:
  contents: read
jobs:
  bounded-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: parser-source
            selectors: 'ParserTest,RuntimeCooperateLanguageTest,MemberSuspensionLanguageTest,SourceTaskCancelRaceTest,BorrowControlFlowHardeningTest,ValueMatchSuspensionTest,AsyncChannelBoundaryTest'
            reports: 'dev.oreslang.ParserTest dev.oreslang.RuntimeCooperateLanguageTest dev.oreslang.MemberSuspensionLanguageTest dev.oreslang.SourceTaskCancelRaceTest dev.oreslang.BorrowControlFlowHardeningTest dev.oreslang.ValueMatchSuspensionTest dev.oreslang.AsyncChannelBoundaryTest'
          - suite: runtime-scheduler
            selectors: 'ActorPhysicalTurnGateTest,OresFutureTerminalNotificationRaceTest,CleanupAwareSchedulerCancellationTest,SourceCooperationQuantumTest,ActorFutureBlockingTest,OresFutureHostWaiterDetachmentTest'
            reports: 'dev.oreslang.runtime.ActorPhysicalTurnGateTest dev.oreslang.runtime.OresFutureTerminalNotificationRaceTest dev.oreslang.runtime.CleanupAwareSchedulerCancellationTest dev.oreslang.runtime.SourceCooperationQuantumTest dev.oreslang.runtime.ActorFutureBlockingTest dev.oreslang.runtime.OresFutureHostWaiterDetachmentTest'
    steps:
      - name: Checkout local funded mirror without credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify compiler and test exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD:compiler/src/main)" = 0c011ed986acab18dc7eb701271afbd2537bed10
          test "$(git rev-parse HEAD:compiler/src/main/java)" = d44cde93c1931dee2ba88bccc98c9dbec77e07e6
          test "$(git rev-parse HEAD:compiler/stdlib)" = 58624daeecbe848db51cdd40a9da7e309fe69bc5
          test "$(git hash-object compiler/pom.xml)" = 2e566927d4b8e07884ce53b0c463d440201fe54c
          test "$(git hash-object compiler/src/test/java/dev/oreslang/ParserTest.java)" = b23bf4a400285298c65a432a6e89e73d3c80d8f0
          test "$(git hash-object compiler/src/test/java/dev/oreslang/RuntimeCooperateLanguageTest.java)" = 997f1baad30ccbac4c06133190baf1b5db062123
          test "$(git hash-object compiler/src/test/java/dev/oreslang/MemberSuspensionLanguageTest.java)" = 091d9a69cdb3b6552ddf0cc960a74f9c6713e493
          test "$(git hash-object compiler/src/test/java/dev/oreslang/SourceTaskCancelRaceTest.java)" = ed4bb24f175451b0e38fb610b47ca012a7f81a96
          test "$(git hash-object compiler/src/test/java/dev/oreslang/BorrowControlFlowHardeningTest.java)" = 0012971039ae0790239689ad607de9fe4144af08
          test "$(git hash-object compiler/src/test/java/dev/oreslang/ValueMatchSuspensionTest.java)" = a516d0164ab4bfd1ec4f836fe949ec60e4d5a1ef
          test "$(git hash-object compiler/src/test/java/dev/oreslang/AsyncChannelBoundaryTest.java)" = b793325712f12ed4e6ccae62f7832ccf2bf9dc21
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/ActorPhysicalTurnGateTest.java)" = 5c3bd93cac1645e18c2cd2f73bf5a65494a2e5c2
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/OresFutureTerminalNotificationRaceTest.java)" = 9e5151f15890f3578f5e246cc70bc551ea9f2bf8
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/CleanupAwareSchedulerCancellationTest.java)" = a29c9df1dc6c84870c3350f4a9ed07b2b1bb5f7e
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/SourceCooperationQuantumTest.java)" = 1ac8b784ddd7e496fd6ad3b261cd610ab493d5f1
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/ActorFutureBlockingTest.java)" = 447899b358315e1657596a6e907a1c28ca6378e9
          test "$(git hash-object compiler/src/test/java/dev/oreslang/runtime/OresFutureHostWaiterDetachmentTest.java)" = 276846d7c67ff363d9e19920408498f9ed47af69
          echo "SOURCE_HEAD=ddee99ce9bb71ab51cf486427279f42204de9636 TEST_SOURCE_HASHES=13"
      - name: Set up GraalVM Java 25
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
          cache-dependency-path: compiler/pom.xml
      - name: Execute selected JUnit suites and verify nonzero executed reports
        shell: bash
        env:
          SELECTORS: ${{ matrix.selectors }}
          REPORTS: ${{ matrix.reports }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 690s mvn -B -ntp -f compiler/pom.xml "-Dtest=$SELECTORS" -DfailIfNoTests=true -DtrimStackTrace=false test 2>&1 | tee "broad-$SUITE.log"
          total=0
          for named in $REPORTS; do
            f="compiler/target/surefire-reports/TEST-$named.xml"
            test -f "$f"
            grep -q '<testcase ' "$f"
            grep -q 'failures="0"' "$f"
            grep -q 'errors="0"' "$f"
            grep -q 'skipped="0"' "$f"
            n="$(grep -c '<testcase ' "$f")"
            test "$n" -gt 0
            total=$((total+n))
            echo "EXECUTED_TEST_REPORT=$named COUNT=$n"
          done
          test "$total" -gt 0
          echo "PASS_EXTENDED_SUITE=$SUITE EXECUTED_CASES=$total"
      - name: Preserve JUnit reports and logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen-star-broad-${{ matrix.suite }}
          path: |
            compiler/target/surefire-reports/
            broad-*.log
          if-no-files-found: ignore
