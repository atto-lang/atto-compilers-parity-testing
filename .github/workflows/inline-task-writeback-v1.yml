name: Exact inline task branch writeback - independent backends
on:
  pull_request:
    paths:
      - 'fixtures/inline-task-writeback-v1/**'
      - 'tools/run-inline-task-writeback-v1.sh'
      - '.github/workflows/inline-task-writeback-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [llvm, rs, js, cranelift, forge, wasm, hdl]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact corpus head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %T'
          test -z "$(git status --porcelain)"
          bash -n tools/run-inline-task-writeback-v1.sh
          node --version
          rustc --version
      - name: Build pinned compiler and execute corpus
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          bash tools/run-inline-task-writeback-v1.sh "$BACKEND" | tee inline-task-writeback.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inline-task-writeback-${{ matrix.backend }}
          path: inline-task-writeback.log
          if-no-files-found: warn
