name: POC26 pinned 90-pattern host gates (NO guest compiler)
on:
  push:
    branches:
      - ci/atto-poc26-exact-fixture-host-check-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poc26-host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact donor head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Source mirror SHA and Git blob identity admission
        shell: bash
        env:
          EXPECTED_DONOR_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DONOR_HEAD"
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          m=json.loads(Path('ci/poc26-source-manifest.json').read_text())
          assert m["source_repository"] == "ores-truffle-oreslang/oreslang-proof-of-concepts"
          assert m["source_commit"] == "411b9c9af106120d01a9a610e5134ff1760cc0f0"
          assert m["source_tree"] == "64588bd18fd9741d0cc1fdbb2b4cfa0d7efaf428"
          assert len(m["files"]) >= 195
          for name,expected in m["files"].items():
              p=Path(name)
              assert p.is_file() and not p.is_symlink(), name
              payload=p.read_bytes()
              blob=hashlib.sha1(f"blob {len(payload)}".encode()+bytes([0])+payload).hexdigest()
              assert blob == expected, (name, blob, expected)
          print("EXACT_PR_HEAD_BLOB_MIRROR",len(m["files"]),"SHARED_GIT_BLOBS VERIFIED; FULL_SOURCE_TREE_NOT_MIRRORED")
          PY
          printf 'DONOR_HEAD=%s DONOR_TREE=%s RUN=%s ATTEMPT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Catalog adversarial tests (synthetic)
        run: python3 -m unittest discover -s src/validation -p 'test_check_catalog.py' -v
      - name: Source tree mutation self-tests (synthetic)
        run: python3 -m unittest discover -s src/validation -p 'test_verify_source_tree.py' -v
      - name: Pinned AttoLang tip source-identity tests
        run: python3 -m unittest discover -s src/validation/atto-tip -p 'test_atto_tip_fixtures.py' -v
      - name: Pattern source grammar hygiene self-tests (synthetic)
        run: python3 -m unittest discover -s src/patterns -p 'test_tip_syntax_hygiene.py' -v
      - name: All 90 actual pattern source/oracle inventory (NOT compiler)
        run: python3 src/patterns/run_examples.py --list
      - name: All 90 actual pattern-source hygiene (NOT parser)
        run: python3 src/patterns/tip_syntax_hygiene.py
      - name: Pattern runner adversarial self-tests (mocked compiler only)
        run: python3 -m unittest discover -s src/patterns -p 'test_run_examples.py' -v
      - name: All 32 actual AttoLang library probe inventory (NOT compiler)
        run: python3 src/libraries/check_prototypes.py --list
      - name: Library probe harness adversarial tests (mocked toolchain only)
        run: python3 -m unittest discover -s src/libraries -p 'test_check_prototypes.py' -v
      - name: Rust catalog gate host unit tests
        run: |
          cargo fmt --manifest-path tools/catalog-gate/Cargo.toml --all -- --check
          cargo test --manifest-path tools/catalog-gate/Cargo.toml --offline --locked
      - name: Rust pattern runner host unit tests
        run: |
          cargo fmt --manifest-path tools/pattern-runner/Cargo.toml --all -- --check
          cargo test --manifest-path tools/pattern-runner/Cargo.toml --offline --locked
      - name: Rust full 90 pattern source/oracle inventory (NOT guest)
        run: cargo run --manifest-path tools/pattern-runner/Cargo.toml --offline --locked -- --root . --list
      - name: Evidence scope boundary
        run: echo "HOST_ONLY; exact-byte partial source mirror, NO Java/GraalVM/LLVM/NativeAOT/Wasm/Forge compiler, guest execution or AOT parity claim"
