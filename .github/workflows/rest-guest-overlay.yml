name: REST guest via private exact-tree test overlay
on:
  push:
    branches:
      - ci/atto-rest-pr72-real-guest-overlay-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout local source and vendored pinned trees
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Verify exact overlay provenance, not a source-tree alias
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\n' < SOURCE_REF)" = 4b0ff7dd4063df2906dc2fed0f6b6348b69807c6
          test "$(git rev-parse HEAD:.cache/oreslang-source.java)" = 8ef1558e3e3fb58539f2ecefe207f9601e218c90
          test "$(git rev-parse HEAD:dependencies/otel)" = 60c6f66a680b315742ec9a3cffe7ec031fd85515
          test "$(git rev-parse HEAD:dependencies/spin/dependencies/http-routing)" = 97d55d96901887a60f3cdac60f8af4f14b05e4c7
          test -e .cache/oreslang-source.java/pom.xml
          test -e dependencies/spin/scripts/compiler.sh
          test -e dependencies/spin/dependencies/http-routing/src/http_routing.ores
          test -e dependencies/otel/src
          echo "GUEST_OVERLAY_HEAD=$EXPECTED_HEAD"
          echo "SOURCE_DEMO_TREE=ba4c75085bd62f9473066efc24fa4365dfde46dd"
          echo "SOURCE_COMPILER_COMMIT=4b0ff7dd4063df2906dc2fed0f6b6348b69807c6"
          echo "SOURCE_COMPILER_BASE_TREE=bed52a435ebce6b2100bface266ae1a38a09e566"
          echo "COMPILER_PATCH_OVERLAY_TREE=8ef1558e3e3fb58539f2ecefe207f9601e218c90"
          echo "COMPILER_PATCH_SCOPE=NativeHttp_request_body_error_mapping"
          echo "SPIN_COMMIT=a961e235f4a5ea81cca99df401dd490642af7163"
          echo "SPIN_TREE=03dbf9129b477936c4b230c6082fd5bd66340623"
          echo "HTTP_ROUTING_COMMIT=9d0bc7550d0e799f561d187177b9d841e5a7a8fc"
          echo "OTEL_COMMIT=5fe62a3447e77072cfd30850a96ef654a18008f7"
          echo "PROVENANCE_CHECK=PASS_GIT_TREES_ONLY"
      - name: Install Java 25 for pinned compiler
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile pinned real Java/GraalVM compiler and dependency classpath
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          mvn -B -ntp -f .cache/oreslang-source.java/pom.xml -DskipTests package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          test -s .cache/oreslang-source.java/target/classpath.txt
          test -e .cache/oreslang-source.java/target/classes/dev/oreslang/launcher/OresMain.class
          echo "PINNED_JAVA_COMPILER=BUILT"
      - name: Run real pinned guest HTTP integration and compiler diagnostics
        shell: bash
        env:
          ORESLANG_SOURCE_DIR: ${{ github.workspace }}/.cache/oreslang-source.java
        run: |
          set -euo pipefail
          bash scripts/test.sh
          echo "REAL_REST_INTEGRATION=PASS"
      - name: Run strict real HTTP/1.1 adversarial guest cases
        shell: bash
        env:
          ORESLANG_SOURCE_DIR: ${{ github.workspace }}/.cache/oreslang-source.java
        run: |
          set -euo pipefail
          cargo run --offline --manifest-path tools/http-negative/Cargo.toml -- --run
          echo "REAL_REST_HTTP_NEGATIVE=PASS"
