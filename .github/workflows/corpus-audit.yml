name: Corpus audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # pull_request defaults to an ephemeral synthetic merge commit.
          # Audit the real PR head, or the actual SHA on a direct push.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Verify exact checked-out commit and emit immutable tree receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          source_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          test "${#source_tree}" -eq 40
          {
            printf 'SOURCE_COMMIT=%s\n' "$EXPECTED_HEAD"
            printf 'SOURCE_TREE=%s\n' "$source_tree"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Format-check parity runner
        run: cargo fmt --manifest-path tools/parity-runner/Cargo.toml -- --check
      - name: Test parity runner
        run: cargo test --manifest-path tools/parity-runner/Cargo.toml --locked --all-targets
      - name: Deny Rust warnings across all parity-runner targets
        run: cargo clippy --manifest-path tools/parity-runner/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build parity runner
        run: cargo build --manifest-path tools/parity-runner/Cargo.toml --locked --bins
      - name: Validate synthetic exact-run evidence contract (not real CI evidence)
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml --locked --bin evidence-contract -- \
            evidence/fixtures/synthetic-runner-executed.json
      - name: Validate historical Java attempt-2 host evidence bundle
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml --locked --bin evidence-contract -- \
            evidence/java-fast-ci-38338581442-attempt2.json
      - name: Audit 73 x 6 required matrix without making compiler claims
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml -- --output parity-results.json
          node - <<'NODE'
          const d = require("./parity-results.json");
          const expected = {legacy_cases:55,multifile_checks:16,negative_probes:2,total_cases:73};
          if (JSON.stringify(d.corpus) !== JSON.stringify(expected)) process.exit(1);
          if (d.cases !== 73 || d.records.length !== 438 || d.summary.not_run !== 438) process.exit(1);
          if (JSON.stringify(d.backends) !== JSON.stringify(
            ["llvm","java","wasm","dotnet","forge","cranelift"])) process.exit(1);
          const signedI64 = d.records.filter(r => ["32","33","34","35"].includes(r.case_id));
          if (signedI64.length !== 24 ||
              !signedI64.every(r => r.status === "not_run" && r.validation_status === "candidate" &&
                  !r.name.startsWith("glm-"))) {
            throw new Error("canonical signed-i64 identity was overwritten");
          }
          const glmRecords = d.records.filter(r => r.name.startsWith("glm-"));
          if (glmRecords.length !== 120 || new Set(glmRecords.map(r => r.case_id)).size !== 20)
              throw new Error("missing or duplicated 20 GLM shared-source cases");
          const missingCranelift = d.records.filter(r => r.backend === "cranelift");
          if (missingCranelift.length !== 73 ||
              !missingCranelift.every(r => r.status === "not_run")) process.exit(1);
          const checks = d.records.filter(r => r.suite === "checks");
          const positives = checks.filter(r => typeof r.graph_sha256 === "string");
          if (checks.length !== 108 || positives.length !== 96) process.exit(1);
          if (!positives.every(r => Array.isArray(r.graph_files) && r.graph_files.length >= 4)) process.exit(1);
          if (!checks.every(r => Array.isArray(r.features) && r.features.length > 0)) process.exit(1);
          // Independent manifest-to-record identity and source SHA audit.
          // Counting 438 rows alone cannot detect a duplicate case displacing
          // an omitted case, or a report over a different set of source bytes.
          const {createHash} = require("node:crypto");
          const {readFileSync, lstatSync} = require("node:fs");
          const {isAbsolute} = require("node:path");
          const sha = value => createHash("sha256").update(value).digest("hex");
          const source = rel => {
            if (typeof rel !== "string" || isAbsolute(rel) ||
                rel.split("/").some(x => x === ".." || x === "")) {
              throw new Error("unsafe source reference: " + rel);
            }
            const {join} = require("node:path");
            let ancestor = "";
            for (const component of rel.split("/")) {
              ancestor = join(ancestor, component);
              if (lstatSync(ancestor).isSymbolicLink())
                throw new Error("symlinked source ancestor: " + ancestor);
            }
            if (!lstatSync(rel).isFile()) throw new Error("nonregular source: " + rel);
            return readFileSync(rel);
          };
          const expectedSource = new Map();
          const add = (suite, id, rel) => {
            const key = suite + "/" + id;
            if (expectedSource.has(key)) throw new Error("duplicate logical case: " + key);
            expectedSource.set(key, {rel, digest: sha(source(rel))});
          };
          const manifest = JSON.parse(readFileSync("manifest.json"));
          if (JSON.stringify(manifest.policy.target_backends) !== JSON.stringify(
              ["llvm","java","wasm","dotnet","forge","cranelift"])) process.exit(1);
          if (JSON.stringify(manifest.policy.optional_backends) !== JSON.stringify(["js"]))
            throw new Error("JavaScript must remain separately selectable, not mandatory");
          if (manifest.cases.length !== 55) throw new Error("bad legacy inventory length");
          for (const c of manifest.cases) {
            if (c.required_on_all_backends !== true || !c.features.length)
              throw new Error("optional legacy case: " + c.id);
            add("legacy", c.id, c.path);
          }
          const checkManifest = JSON.parse(readFileSync("checks/manifest.json"));
          for (const c of checkManifest.checks) {
            const e = JSON.parse(source(c.expectation));
            if (e.name !== c.name) throw new Error("check name mismatch");
            add("checks", c.name, e.entry);
            for (const [index, negative] of (e.negative_cases || []).entries()) {
              add("checks", c.name + "/negative-" + (index + 1), negative.path);
            }
          }
          if (expectedSource.size !== 73 || d.executed !== false || d.schema_version !== 2)
            throw new Error("wrong static matrix count or execution state");
          const expectedBackends = ["llvm","java","wasm","dotnet","cranelift","js"];
          const observed = new Set();
          for (const r of d.records) {
            const key = r.suite + "/" + r.case_id;
            const expected = expectedSource.get(key);
            if (!expected) throw new Error("unregistered case: " + key);
            if (!expectedBackends.includes(r.backend)) throw new Error("unknown backend");
            const pair = key + "/" + r.backend;
            if (observed.has(pair)) throw new Error("duplicate backend/case record: " + pair);
            observed.add(pair);
            if (r.source_sha256 !== expected.digest ||
                r.status !== "not_run" || r.compile !== null || r.run !== null)
              throw new Error("fabricated or mismatched static evidence: " + pair);
            if (r.graph_files !== null) {
              if (!Array.isArray(r.graph_files) || r.graph_files.length < 4 ||
                  JSON.stringify(r.graph_files) !== JSON.stringify([...new Set(r.graph_files)].sort()) ||
                  !r.graph_files.includes(expected.rel))
                throw new Error("invalid graph inventory: " + pair);
              const payload = r.graph_files.map(rel =>
                rel + String.fromCharCode(0) + sha(source(rel)) + String.fromCharCode(10)).join("");
              if (sha(Buffer.from(payload, "utf8")) !== r.graph_sha256)
                throw new Error("source graph identity mismatch: " + pair);
            } else if (r.graph_sha256 !== null) {
              throw new Error("graph digest without source inventory: " + pair);
            }
          }
          if (observed.size !== expectedSource.size * expectedBackends.length)
            throw new Error("missing backend/case pair despite correct record count");
          if (Object.keys(d.summary).length !== 1 || d.summary.not_run !== 438)
            throw new Error("unexpected result classified as executed");
          NODE
      - name: Audit optional JavaScript separately (not a required native pass)
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml -- --backend js --output js-inventory.json
          node - <<'NODE'
          const d = require("./js-inventory.json");
          if (d.executed !== false || d.cases !== 73 ||
              JSON.stringify(d.backends) !== JSON.stringify(["js"]) ||
              d.records.length !== 73 || d.summary.not_run !== 73 ||
              !d.records.every(r => r.backend === "js" && r.status === "not_run"))
              process.exit(1);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-corpus-audit
          path: |
            parity-results.json
            js-inventory.json
