name: Corpus audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Verify exact original source head, tree and actor contract blob
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          pos="contracts/atto-actor-critical-v1/fixtures/two-actor-snapshot-positive.atto"
          sha="a6189d92c813426ecf54a09cf535c3874de45942"
          test "$(git rev-parse "HEAD:$pos")" = "$sha"
          test "$(git hash-object --no-filters "$pos")" = "$sha"
          echo "source_head=$EXPECTED_HEAD"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
          echo "positive_guest_blob=$sha"
          echo "compiler_guest_execution=NOT_EXECUTED"
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Format-check parity runner
        run: cargo fmt --manifest-path tools/parity-runner/Cargo.toml -- --check
      - name: Test parity runner
        run: cargo test --manifest-path tools/parity-runner/Cargo.toml --locked
      - name: Build parity runner
        run: cargo build --manifest-path tools/parity-runner/Cargo.toml --locked --bins
      - name: Validate synthetic exact-run evidence contract fixture
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml --bin evidence-contract -- \
            evidence/fixtures/synthetic-runner-executed.json
      - name: Validate recorded Java attempt-2 host execution bundle
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml --bin evidence-contract -- \
            evidence/java-fast-ci-38338581442-attempt2.json
      - name: Audit 54 x 6 required-backend matrix without compiler claims
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml -- --output parity-results.json
          node - <<'NODE'
          const d = require("./parity-results.json");
          const expected = {legacy_cases:36,multifile_checks:16,negative_probes:2,total_cases:54};
          if (JSON.stringify(d.corpus) !== JSON.stringify(expected)) process.exit(1);
          if (d.cases !== 54 || d.records.length !== 324 || d.summary.not_run !== 324) process.exit(1);
          if (JSON.stringify(d.backends) !== JSON.stringify(["llvm","java","wasm","dotnet","forge","cranelift"])) process.exit(1);
          const checks = d.records.filter(r => r.suite === "checks");
          const positives = checks.filter(r => typeof r.graph_sha256 === "string");
          if (checks.length !== 108 || positives.length !== 96) process.exit(1);
          if (!positives.every(r => Array.isArray(r.graph_files) && r.graph_files.length >= 4)) process.exit(1);
          if (!checks.every(r => Array.isArray(r.features) && r.features.length > 0)) process.exit(1);
          const arithmetic = d.records.filter(r => ["32","33","34","35"].includes(r.case_id));
          if (arithmetic.length !== 24 || !arithmetic.every(r => r.status === "not_run" && r.validation_status === "candidate")) process.exit(1);
          NODE
      - name: Inventory SHA-pinned native .atto actor critical contract for all 11 profiles
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml --locked -- --actor-critical --output actor-critical-inventory.json
          node - <<'NODE'
          const d = require("./actor-critical-inventory.json");
          if (d.cases !== 3 || d.records.length !== 33 || d.summary.not_run !== 33) process.exit(1);
          if (d.backends.length !== 11 || d.executed) process.exit(1);
          if (!d.records.every(r => r.suite === "atto-actor-critical-v1" && r.validation_status === "unvalidated")) process.exit(1);
          console.log("ACTOR_CRITICAL_ALL_11=33_INVENTORY_CELLS_0_GUEST_RECEIPTS");
          NODE
      - name: Refuse unverified Atto actor guest attempts (strict and exploratory)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml --locked -- --actor-critical --backend java --execute --output actor-critical-unvalidated.json
          rc1=$?
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml --locked -- --actor-critical --backend java --execute --allow-unvalidated --output actor-critical-no-adapter.json
          rc2=$?
          set -e
          test "$rc1" -ne 0
          test "$rc2" -ne 0
          node - <<'NODE'
          const strict = require("./actor-critical-unvalidated.json");
          const exploratory = require("./actor-critical-no-adapter.json");
          if (strict.records.length !== 3 || strict.summary.unvalidated !== 3) process.exit(1);
          if (exploratory.records.length !== 3 || exploratory.summary.backend_not_configured !== 3) process.exit(1);
          if (![...strict.records, ...exploratory.records].every(r => !r.compile && !r.run)) process.exit(1);
          console.log("NO_COMPILER_ADAPTER_CAN_NOT_CERTIFY_ACTOR_GUEST");
          NODE
      - name: Audit optional JavaScript transpiler separately
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml -- --backend js --output parity-js-optional.json
          node - <<'NODE'
          const d = require("./parity-js-optional.json");
          if (JSON.stringify(d.backends) !== JSON.stringify(["js"])) process.exit(1);
          if (d.cases !== 54 || d.records.length !== 54 || d.summary.not_run !== 54) process.exit(1);
          NODE
      - name: Audit source-only corpus receipt completeness and adversarial mutations
        run: |
          node --test tests/corpus-report-admission.test.mjs
          node tools/corpus-report-admission.mjs parity-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-corpus-audit
          path: |
            parity-results.json
            parity-js-optional.json
