name: Corpus audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Format-check parity runner
        run: cargo fmt --manifest-path tools/parity-runner/Cargo.toml -- --check
      - name: Test parity runner
        run: cargo test --manifest-path tools/parity-runner/Cargo.toml --locked
      - name: Build parity runner
        run: cargo build --manifest-path tools/parity-runner/Cargo.toml --locked --bins
      - name: Audit 49 x 5 matrix without making compiler claims
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml -- --output parity-results.json
          node - <<'NODE'
          const d = require("./parity-results.json");
          const expected = {legacy_cases:31,multifile_checks:16,negative_probes:2,total_cases:49};
          if (JSON.stringify(d.corpus) !== JSON.stringify(expected)) process.exit(1);
          if (d.cases !== 49 || d.records.length !== 245 || d.summary.not_run !== 245) process.exit(1);
          const checks = d.records.filter(r => r.suite === "checks");
          const positives = checks.filter(r => typeof r.graph_sha256 === "string");
          if (checks.length !== 90 || positives.length !== 80) process.exit(1);
          if (!positives.every(r => Array.isArray(r.graph_files) && r.graph_files.length >= 4)) process.exit(1);
          if (!checks.every(r => Array.isArray(r.features) && r.features.length > 0)) process.exit(1);
          NODE
      - name: Audit 7 x 5 candidate without feature-pass claims
        run: |
          cargo run --quiet --locked --manifest-path tools/parity-runner/Cargo.toml \
            --bin injected-state-candidate > injected-state-candidate.json
          node - <<'NODE'
          const f = require("./injected-state-candidate.json");
          if (f.required_parity !== false || f.parity_pass !== false ||
              f.suite_status !== "candidate_unverified" ||
              f.records.length !== 35 || f.observed_candidates !== 0 ||
              f.records.some(r => r.state !== "not_run" ||
                !/^[a-f0-9]{64}$/.test(r.source_sha256))) {
            process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-corpus-audit
          path: |
            parity-results.json
            injected-state-candidate.json
