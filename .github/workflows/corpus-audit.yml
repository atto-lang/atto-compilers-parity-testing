name: Corpus audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Format-check parity runner
        run: cargo fmt --manifest-path tools/parity-runner/Cargo.toml -- --check
      - name: Test parity runner
        run: cargo test --manifest-path tools/parity-runner/Cargo.toml --locked
      - name: Build parity runner
        run: cargo build --manifest-path tools/parity-runner/Cargo.toml --locked --bins
      - name: Audit manifest-derived six-backend inventory without compiler claims
        run: |
          cargo run --quiet --manifest-path tools/parity-runner/Cargo.toml -- --output parity-results.json
          node - <<'NODE'
          const d = require("./parity-results.json");
          const fs = require("node:fs");
          const source = JSON.parse(fs.readFileSync("manifest.json","utf8"));
          const legacy = source.cases;
          // Corpus growth is allowed only as NOT-RUN inventory; any mutation
          // must still satisfy unique case IDs, paths, features and fixed gates.
          if (!Array.isArray(legacy) || legacy.length < 44 || legacy.length > 512) process.exit(1);
          if (new Set(legacy.map(c=>c.id)).size !== legacy.length) process.exit(1);
          if (new Set(legacy.map(c=>c.path)).size !== legacy.length) process.exit(1);
          if (!legacy.every(c => new RegExp("^programs/[0-9]{2}-[a-z0-9-]+[.]ores$").test(c.path))) process.exit(1);
          if (!legacy.every(c => Array.isArray(c.features) && c.features.length > 0)) process.exit(1);
          const expected = {legacy_cases:legacy.length,multifile_checks:16,
                            negative_probes:2,total_cases:legacy.length+18};
          if (JSON.stringify(d.corpus) !== JSON.stringify(expected)) process.exit(1);
          if (JSON.stringify(d.backends) !== JSON.stringify(["llvm","java","wasm","dotnet","js","cranelift"])) process.exit(1);
          if (d.executed !== false) process.exit(1);
          const total = expected.total_cases * d.backends.length;
          if (d.cases !== expected.total_cases || d.records.length !== total || d.summary.not_run !== total) process.exit(1);
          // A source-only manifest audit can never attest to executed tests.
          if (!d.records.every(r => r.status === "not_run" && r.compile === null && r.run === null)) process.exit(1);
          const checks = d.records.filter(r => r.suite === "checks");
          const positives = checks.filter(r => typeof r.graph_sha256 === "string");
          if (checks.length !== 108 || positives.length !== 96) process.exit(1);
          if (!positives.every(r => Array.isArray(r.graph_files) && r.graph_files.length >= 4)) process.exit(1);
          if (!checks.every(r => Array.isArray(r.features) && r.features.length > 0)) process.exit(1);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-corpus-audit
          path: parity-results.json
